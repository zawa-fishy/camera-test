<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>海洋プラスチックAI カメラ</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #eaf7fc;
      color: #174055;
      padding: 15px;
      text-align: center;
    }

    main {
      max-width: 660px;
      margin: auto;
      background: #fff;
      border-radius: 18px;
      padding: 20px;
      box-sizing: border-box;
    }

    video {
      width: 100%;
      max-height: 450px;
      background: #173847;
      border-radius: 12px;
      object-fit: contain;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #008dbb;
      color: #fff;
      font-size: 17px;
      cursor: pointer;
    }

    button.secondary {
      background: #e4eff4;
      color: #174055;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    p {
      line-height: 1.6;
    }
  </style>
</head>

<body>
<main>
  <h1>📷 写真を撮影</h1>

  <p>
    カメラで撮影した写真を元のAI判別画面に渡します。
    カメラ映像そのものを自動で送信することはありません。
  </p>

  <video id="video" autoplay muted playsinline></video>

  <button id="shoot" type="button" disabled>
    📸 この写真を使う
  </button>

  <button id="close" class="secondary" type="button">
    閉じる
  </button>

  <p id="message" role="status" aria-live="polite">
    カメラを起動しています…
  </p>
</main>

<script>
"use strict";

const params = new URLSearchParams(location.search);
const returnOrigin = params.get("origin") || "";
const nonce = params.get("nonce") || "";

const video = document.getElementById("video");
const shootButton = document.getElementById("shoot");
const closeButton = document.getElementById("close");
const message = document.getElementById("message");

let stream = null;
let sending = false;

function allowedOrigin(origin) {
  try {
    const u = new URL(origin);

    return u.protocol === "https:" &&
      (
        u.hostname === "script.google.com" ||
        u.hostname.endsWith(".googleusercontent.com")
      );
  } catch (e) {
    return false;
  }
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  video.srcObject = null;
  shootButton.disabled = true;
}

async function startCamera() {
  if (!window.opener || window.opener.closed ||
      !allowedOrigin(returnOrigin) ||
      !/^[A-Za-z0-9_-]{12,90}$/.test(nonce)) {
    message.textContent =
      "元のAI画面との通信を確認できません。" +
      "元のAI画面からカメラを開いてください。";
    return;
  }

  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {
    message.textContent =
      "カメラに対応していないか、安全な接続ではありません。" +
      "HTTPSのURLを開いてください。";
    return;
  }

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

    shootButton.disabled = false;
    message.textContent =
      "撮影したいものを映してボタンを押してください。";

  } catch (e) {
    stopCamera();

    message.textContent =
      "カメラを起動できませんでした。" +
      "ブラウザーのカメラ許可を確認してください。" +
      "（" + e.name + "）";
  }
}

shootButton.addEventListener("click", () => {
  if (sending || !stream || !video.videoWidth) {
    return;
  }

  sending = true;
  shootButton.disabled = true;

  try {
    const ratio = Math.min(
      1,
      1200 / Math.max(video.videoWidth, video.videoHeight)
    );

    const canvas = document.createElement("canvas");
    canvas.width = Math.round(video.videoWidth * ratio);
    canvas.height = Math.round(video.videoHeight * ratio);

    const context = canvas.getContext("2d");

    if (!context) {
      throw new Error("画像を作成できません");
    }

    context.drawImage(
      video, 0, 0, canvas.width, canvas.height
    );

    const dataUrl = canvas.toDataURL("image/jpeg", 0.78);

    if (!window.opener || window.opener.closed) {
      throw new Error("元のAI画面が閉じられています");
    }

    window.opener.postMessage(
      {
        type: "PLASTIC_CAMERA_CAPTURE",
        nonce: nonce,
        dataUrl: dataUrl
      },
      returnOrigin
    );

    message.textContent =
      "写真を送りました。元のAI判別画面に戻ってください。";

    stopCamera();

    setTimeout(() => window.close(), 700);

  } catch (e) {
    sending = false;
    shootButton.disabled = false;
    message.textContent = "撮影に失敗しました：" + e.message;
  }
});

closeButton.addEventListener("click", () => {
  stopCamera();
  window.close();
});

window.addEventListener("pagehide", stopCamera);

startCamera();
</script>
</body>
</html>
