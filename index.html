
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf7fc">
  <title>海洋プラスチックAI</title>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #eaf7fc;
      color: #173b4a;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    main {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px 0 18px;
    }

    h1 {
      font-size: 27px;
      margin-bottom: 8px;
    }

    header p {
      color: #58727d;
      font-size: 14px;
    }

    .panel {
      background: white;
      padding: 18px;
      margin: 14px 0;
      border-radius: 18px;
      box-shadow: 0 4px 16px #173b4a12;
    }

    video, #photo {
      display: block;
      width: 100%;
      max-height: 420px;
      object-fit: contain;
      border-radius: 14px;
      background: #173b4a;
      margin: 12px auto;
    }

    #photo[hidden], video[hidden] {
      display: none;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: 0;
      border-radius: 12px;
      background: #087eaa;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      background: #9baeb7;
      cursor: not-allowed;
    }

    button.secondary {
      color: #175064;
      background: #e3f1f6;
    }

    #status {
      text-align: center;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.7;
      padding: 12px;
      border-radius: 10px;
      background: #edf5f8;
    }

    #result {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      overflow-wrap: anywhere;
      margin: 16px 0 8px;
    }

    #confidence {
      text-align: center;
      color: #58727d;
      font-size: 15px;
    }

    #scores {
      margin-top: 18px;
    }

    .score-row { margin: 12px 0; }

    .score-label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .bar {
      height: 10px;
      background: #e0e9ed;
      border-radius: 10px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      background: #16a0b7;
      border-radius: 10px;
    }

    .note {
      text-align: center;
      color: #58727d;
      font-size: 12px;
      line-height: 1.7;
    }

    .hidden { display: none !important; }

    @media (max-width: 450px) {
      body { padding: 12px; }
      .panel { padding: 14px; }
      h1 { font-size: 23px; }
    }
  </style>
</head>

<body>
<main>
  <header>
    <h1>🌊 海洋プラスチックAI</h1>
    <p>写真を撮るだけで、AIがゴミの種類を判定します。</p>
  </header>

  <section class="panel">
    <video id="video" autoplay playsinline muted></video>
    <img id="photo" alt="撮影した写真" hidden>

    <button id="start" disabled>カメラを起動</button>
    <button id="capture" disabled>撮影して判定・保存</button>
    <button id="again" class="secondary hidden">もう一度撮影する</button>
  </section>

  <section class="panel">
    <p id="status">AIモデルを準備しています...</p>
    <div id="result" aria-live="polite">準備中</div>
    <p id="confidence"></p>
    <div id="scores"></div>
  </section>

  <p class="note">
    判定結果と撮影写真は研究記録として保存します。<br>
    保存処理の状況は画面に表示します。
  </p>
</main>

<script>
  // 公開したGASウェブアプリのURL
  const GAS_URL =
    "https://script.google.com/macros/s/AKfycbwLnoOn4J9kl7G5PMA8LaXbKwWnVq-RAxbZ-Ct_VgRdjsdYy5U7fZ9ZLnWxVD0xUSZe/exec";

  // 使用中のTeachable Machineモデル
  const MODEL_URL =
    "https://teachablemachine.withgoogle.com/models/xYekeb-z-";

  let model = null;
  let stream = null;
  let busy = false;

  const video = document.getElementById("video");
  const photo = document.getElementById("photo");
  const startButton = document.getElementById("start");
  const captureButton = document.getElementById("capture");
  const againButton = document.getElementById("again");
  const status = document.getElementById("status");
  const result = document.getElementById("result");
  const confidence = document.getElementById("confidence");
  const scoresBox = document.getElementById("scores");

  function setStatus(message) {
    status.textContent = message;
  }

  async function loadModel() {
    try {
      setStatus("AIを準備しています...");

      model = await tmImage.load(
        MODEL_URL + "/model.json",
        MODEL_URL + "/metadata.json"
      );

      startButton.disabled = false;
      result.textContent = "撮影してください";
      setStatus("準備完了です。カメラを起動してください。");
    } catch (error) {
      setStatus(
        "AIを読み込めませんでした。\n" +
        "モデルURLやインターネット接続を確認してください。"
      );
      result.textContent = "準備できませんでした";
      console.error(error);
    }
  }

  async function startCamera() {
    if (busy) return;

    try {
      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {
        throw new Error("HTTPSのGitHub Pagesサイトから開いてください。");
      }

      startButton.disabled = true;
      setStatus("カメラを起動しています...");

      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });

      video.srcObject = stream;
      video.hidden = false;
      photo.hidden = true;

      await video.play();

      captureButton.disabled = false;
      setStatus("ゴミを画面に映し、「撮影して判定・保存」を押してください。");
    } catch (error) {
      stopCamera();
      startButton.disabled = !model;
      setStatus("カメラを起動できませんでした。\n" + error.message);
    }
  }

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    video.srcObject = null;
    captureButton.disabled = true;
    startButton.disabled = !model || busy;
  }

  // 写真のサイズを小さくし、保存時の通信量を抑える
  function makePhoto() {
    const sourceWidth = video.videoWidth;
    const sourceHeight = video.videoHeight;

    if (!sourceWidth || !sourceHeight) {
      throw new Error("カメラ映像を取得できません。");
    }

    const maxSide = 960;
    const scale = Math.min(
      1,
      maxSide / Math.max(sourceWidth, sourceHeight)
    );

    const canvas = document.createElement("canvas");
    canvas.width = Math.round(sourceWidth * scale);
    canvas.height = Math.round(sourceHeight * scale);

    const context = canvas.getContext("2d");
    context.drawImage(video, 0, 0, canvas.width, canvas.height);

    // JPEG形式に圧縮
    const dataUrl = canvas.toDataURL("image/jpeg", 0.65);

    return { canvas, dataUrl };
  }

  async function captureAndSave() {
    if (!model || !stream || busy) return;

    busy = true;
    captureButton.disabled = true;
    startButton.disabled = true;
    againButton.classList.add("hidden");

    try {
      setStatus("写真を撮影しています...");

      const { canvas, dataUrl } = makePhoto();

      // 撮影した写真を画面に表示
      photo.src = dataUrl;
      photo.hidden = false;
      video.hidden = true;

      // AI判別
      setStatus("AIがゴミの種類を判定しています...");

      const predictions = await model.predict(canvas);
      predictions.sort((a, b) => b.probability - a.probability);

      if (!predictions.length) {
        throw new Error("AIの判定結果がありません。");
      }

      const best = predictions[0];

      result.textContent = best.className;
      confidence.textContent =
        "信頼度：" + (best.probability * 100).toFixed(1) + "%";

      scoresBox.replaceChildren();

      predictions.forEach(item => {
        const row = document.createElement("div");
        row.className = "score-row";

        const label = document.createElement("div");
        label.className = "score-label";

        const name = document.createElement("span");
        name.textContent = item.className;

        const percent = document.createElement("span");
        percent.textContent =
          (item.probability * 100).toFixed(1) + "%";

        label.append(name, percent);

        const bar = document.createElement("div");
        bar.className = "bar";

        const fill = document.createElement("div");
        fill.className = "fill";
        fill.style.width =
          Math.max(0, Math.min(100, item.probability * 100)) + "%";

        bar.appendChild(fill);
        row.append(label, bar);
        scoresBox.appendChild(row);
      });

      // 写真と判定結果をGASへ送信
      setStatus("写真と判定結果を保存しています...");

      const record = {
        label: best.className,
        confidence: best.probability,
        scores: predictions.map(item => ({
          className: item.className,
          probability: item.probability
        })),
        imageBase64: dataUrl.split(",")[1]
      };

      if (record.imageBase64.length > 1500000) {
        throw new Error("写真のサイズが大きすぎます。");
      }

      await fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(record)
      });

      setStatus(
        "判定が完了し、保存リクエストを送信しました。\n" +
        "ブラウザから保存成功を直接確認できないため、" +
        "初回はスプレッドシートで記録を確認してください。"
      );

      againButton.classList.remove("hidden");

    } catch (error) {
      setStatus(
        "処理を完了できませんでした。\n" +
        error.message +
        "\n通信状態や保存先の設定を確認してください。"
      );

      againButton.classList.remove("hidden");
      console.error(error);
    } finally {
      stopCamera();
      busy = false;
      startButton.disabled = !model;
    }
  }

  function takeAgain() {
    if (busy) return;

    photo.hidden = true;
    photo.removeAttribute("src");
    video.hidden = false;

    result.textContent = "撮影してください";
    confidence.textContent = "";
    scoresBox.replaceChildren();

    againButton.classList.add("hidden");
    setStatus("カメラを起動して、もう一度撮影してください。");

    startButton.disabled = !model;
  }

  startButton.addEventListener("click", startCamera);
  captureButton.addEventListener("click", captureAndSave);
  againButton.addEventListener("click", takeAgain);

  window.addEventListener("pagehide", stopCamera);

  loadModel();
</script>
</body>
</html>
