
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf7fc">
  <title>海洋プラスチックAI</title>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #eaf7fc;
      color: #173b4a;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    main {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px 0 18px;
    }

    h1 {
      font-size: 27px;
      margin-bottom: 8px;
    }

    header p, .note {
      color: #58727d;
      font-size: 14px;
      line-height: 1.7;
    }

    .panel {
      background: white;
      padding: 18px;
      margin: 14px 0;
      border-radius: 18px;
      box-shadow: 0 4px 16px #173b4a12;
    }

    video, #photo {
      display: block;
      width: 100%;
      max-height: 420px;
      object-fit: contain;
      border-radius: 14px;
      background: #173b4a;
      margin: 12px auto;
    }

    [hidden] { display: none !important; }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: 0;
      border-radius: 12px;
      background: #087eaa;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      background: #9baeb7;
      cursor: not-allowed;
    }

    #status {
      text-align: center;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.7;
      padding: 12px;
      border-radius: 10px;
      background: #edf5f8;
    }

    #result {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      overflow-wrap: anywhere;
      margin: 16px 0 8px;
    }

    #confidence {
      text-align: center;
      color: #58727d;
      font-size: 15px;
    }

    #scores { margin-top: 18px; }

    .score-row { margin: 12px 0; }

    .score-label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .bar {
      height: 10px;
      background: #e0e9ed;
      border-radius: 10px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      background: #16a0b7;
      border-radius: 10px;
    }

    .note {
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 450px) {
      body { padding: 12px; }
      .panel { padding: 14px; }
      h1 { font-size: 23px; }
    }
  </style>
</head>

<body>
<main>
  <header>
    <h1>🌊 海洋プラスチックAI</h1>
    <p>撮影・AI判定・研究記録の保存</p>
  </header>

  <section class="panel">
    <video id="video" autoplay playsinline muted hidden></video>
    <img id="photo" alt="撮影した写真" hidden>
    <button id="action" disabled>AIを準備しています...</button>
  </section>

  <section class="panel">
    <p id="status">AIモデルを準備しています...</p>
    <div id="result" aria-live="polite">準備中</div>
    <p id="confidence"></p>
    <div id="scores"></div>
  </section>

  <p class="note">
    判定結果はGoogleスプレッドシートに、写真はGoogle Driveに保存します。
  </p>
</main>

<script>
  // ===== 設定 =====

  const GAS_URL =
    "https://script.google.com/macros/s/AKfycbwLnoOn4J9kl7G5PMA8LaXbKwWnVq-RAxbZ-Ct_VgRdjsdYy5U7fZ9ZLnWxVD0xUSZe/exec";

  const MODEL_URL =
    "https://teachablemachine.withgoogle.com/models/xYekeb-z-";

  const SAVE_TIMEOUT_MS = 30000;

  // ===== 状態管理 =====

  let model = null;
  let stream = null;
  let busy = false;
  let mode = "starting";

  const video = document.getElementById("video");
  const photo = document.getElementById("photo");
  const action = document.getElementById("action");
  const status = document.getElementById("status");
  const result = document.getElementById("result");
  const confidence = document.getElementById("confidence");
  const scoresBox = document.getElementById("scores");

  function setStatus(message) {
    status.textContent = message;
  }

  function setMode(nextMode, buttonText) {
    mode = nextMode;
    action.textContent = buttonText;
    action.disabled = busy || !model;
  }

  // ===== AIモデル読み込み =====

  async function loadModel() {
    try {
      setStatus("AIモデルを読み込んでいます...");

      const baseUrl = MODEL_URL.replace(/\/+$/, "");

      model = await tmImage.load(
        baseUrl + "/model.json",
        baseUrl + "/metadata.json"
      );

      setMode("start", "カメラを起動する");
      result.textContent = "準備完了";
      setStatus("準備完了です。ボタンを押してください。");

    } catch (error) {
      console.error(error);
      result.textContent = "AIを読み込めません";

      setStatus(
        "AIモデルの読み込みに失敗しました。\n" +
        "モデルURLとインターネット接続を確認してください。\n" +
        error.message
      );

      action.disabled = true;
    }
  }

  // ===== カメラ起動 =====

  async function startCamera() {
    action.disabled = true;

    try {
      setStatus("カメラを起動しています...");

      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {
        throw new Error(
          "カメラにはHTTPSのサイト、またはlocalhostからアクセスしてください。"
        );
      }

      // 以前のカメラが残っていれば停止
      stopCamera();

      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });

      video.srcObject = stream;
      video.hidden = false;
      photo.hidden = true;

      await video.play();

      setMode("capture", "撮影・AI判定・保存する");
      setStatus(
        "ゴミをカメラに映してください。\n" +
        "準備ができたら同じボタンを押します。"
      );

    } catch (error) {
      stopCamera();

      setStatus(
        "カメラを起動できませんでした。\n" +
        error.message
      );

      setMode("start", "カメラを起動する");
    }
  }

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    video.srcObject = null;
    video.hidden = true;
  }

  // ===== 撮影 =====

  function makePhoto() {
    const width = video.videoWidth;
    const height = video.videoHeight;

    if (!width || !height) {
      throw new Error("カメラ映像を取得できません。");
    }

    const maxSide = 960;
    const scale = Math.min(1, maxSide / Math.max(width, height));

    const canvas = document.createElement("canvas");
    canvas.width = Math.round(width * scale);
    canvas.height = Math.round(height * scale);

    const context = canvas.getContext("2d");

    context.drawImage(
      video,
      0, 0,
      canvas.width,
      canvas.height
    );

    const dataUrl = canvas.toDataURL("image/jpeg", 0.65);

    return { canvas, dataUrl };
  }

  // ===== AI判定結果表示 =====

  function showPredictions(predictions) {
    predictions.sort(
      (a, b) => b.probability - a.probability
    );

    if (!predictions.length) {
      throw new Error("AIの判定結果がありません。");
    }

    const best = predictions[0];

    result.textContent = best.className;
    confidence.textContent =
      "信頼度：" + (best.probability * 100).toFixed(1) + "%";

    scoresBox.replaceChildren();

    predictions.forEach(item => {
      const row = document.createElement("div");
      row.className = "score-row";

      const label = document.createElement("div");
      label.className = "score-label";

      const name = document.createElement("span");
      name.textContent = item.className;

      const percent = document.createElement("span");
      percent.textContent =
        (item.probability * 100).toFixed(1) + "%";

      label.append(name, percent);

      const bar = document.createElement("div");
      bar.className = "bar";

      const fill = document.createElement("div");
      fill.className = "fill";
      fill.style.width =
        Math.max(0, Math.min(100, item.probability * 100)) + "%";

      bar.appendChild(fill);
      row.append(label, bar);
      scoresBox.appendChild(row);
    });

    return best;
  }

  // ===== 保存状況を確認 =====

  function jsonpStatus(requestId) {
    return new Promise((resolve, reject) => {
      const callbackName =
        "__gasCallback_" +
        Date.now() + "_" +
        Math.random().toString(36).slice(2);

      const script = document.createElement("script");

      const timeout = setTimeout(() => {
        cleanup();
        reject(new Error("GASの保存結果を確認できません。"));
      }, 5000);

      function cleanup() {
        clearTimeout(timeout);
        delete window[callbackName];
        script.remove();
      }

      window[callbackName] = data => {
        cleanup();
        resolve(data);
      };

      script.onerror = () => {
        cleanup();
        reject(new Error("GASの状態確認に失敗しました。"));
      };

      script.src =
        GAS_URL +
        "?action=status" +
        "&id=" + encodeURIComponent(requestId) +
        "&callback=" + encodeURIComponent(callbackName) +
        "&t=" + Date.now();

      document.body.appendChild(script);
    });
  }

  async function waitForSave(requestId) {
    const deadline = Date.now() + SAVE_TIMEOUT_MS;

    while (Date.now() < deadline) {
      try {
        const response = await jsonpStatus(requestId);

        if (response && response.status === "success") {
          return response;
        }

        if (response && response.status === "error") {
          throw new Error(
            response.message || "GASで保存に失敗しました。"
          );
        }

      } catch (error) {
        if (
          error.message &&
          error.message.includes("GASで保存に失敗")
        ) {
          throw error;
        }
      }

      await new Promise(resolve => setTimeout(resolve, 1000));
    }

    throw new Error(
      "保存結果を時間内に確認できませんでした。\n" +
      "GASの実行履歴と保存先を確認してください。"
    );
  }

  // ===== GASへ保存 =====

  async function saveRecord(record) {
    const requestId =
      Date.now().toString(36) + "-" + crypto.randomUUID();

    record.requestId = requestId;

    if (record.imageBase64.length > 1500000) {
      throw new Error("写真が大きすぎます。");
    }

    setStatus("写真と判定結果を送信しています...");

    await fetch(GAS_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(record)
    });

    setStatus("保存処理中です。結果を確認しています...");

    return await waitForSave(requestId);
  }

  // ===== 撮影・判定・保存 =====

  async function captureAndSave() {
    busy = true;
    action.disabled = true;

    try {
      setStatus("写真を撮影しています...");

      const { canvas, dataUrl } = makePhoto();

      photo.src = dataUrl;
      photo.hidden = false;
      video.hidden = true;

      stopCamera();

      setStatus("AIがゴミの種類を判定しています...");

      const predictions = await model.predict(canvas);
      const best = showPredictions(predictions);

      const record = {
        label: best.className,
        confidence: best.probability,

        scores: predictions.map(item => ({
          className: item.className,
          probability: item.probability
        })),

        imageBase64: dataUrl.split(",")[1]
      };

      const saved = await saveRecord(record);

      setStatus(
        "保存成功！\n" +
        (saved.message || "写真と判定結果を保存しました。") +
        "\n分類：" + (saved.label || best.className)
      );

      setMode("again", "もう一度撮影する");

    } catch (error) {
      console.error(error);

      setStatus(
        "処理に問題が発生しました。\n" +
        error.message
      );

      setMode("again", "もう一度撮影する");

    } finally {
      busy = false;
      action.disabled = !model;
    }
  }

  // ===== もう一度撮影：自動でカメラ起動 =====

  async function resetForNextPhoto() {
    photo.hidden = true;
    photo.removeAttribute("src");

    video.hidden = true;

    result.textContent = "撮影してください";
    confidence.textContent = "";
    scoresBox.replaceChildren();

    setStatus("次の撮影を開始しています...");

    await startCamera();
  }

  // ===== ボタンは1つだけ =====

  action.addEventListener("click", async () => {
    if (busy || !model) return;

    if (mode === "start") {
      await startCamera();
    } else if (mode === "capture") {
      await captureAndSave();
    } else if (mode === "again") {
      await resetForNextPhoto();
    }
  });

  window.addEventListener("pagehide", stopCamera);

  loadModel();
</script>
</body>
</html>
